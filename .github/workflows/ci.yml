name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    env:
      # The audits print non-ASCII (°, ↓); the Windows console default (cp1252) cannot.
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock

      - name: Lint
        shell: pwsh
        run: python -m ruff check .

      - name: Tests (including golden characterization tests)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Audit - every shape x pattern x setting (quick)
        shell: pwsh
        run: python tools/validation_sweep.py --quick

      - name: Audit - layer-to-layer planning (quick)
        shell: pwsh
        run: python tools/multilayer_audit.py --quick

      - name: Audit - structural PCB random boards (quick)
        shell: pwsh
        run: python tools/pcb_audit.py 12
